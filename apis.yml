name: Go Deed
description: >-
  Go Deed (legally Deed Inc.) is a workplace-giving and corporate social
  responsibility platform founded in 2016 that helps enterprises engage
  employees around volunteering, charitable giving, donation matching, and
  everyday social-impact actions. With teams in New York, San Francisco, and
  Berlin, Deed served Fortune 500 and mid-market employers before being acquired
  into Bonterra, where it now ships as the "Deed" employee-engagement product.
  The joindeed.com domain 301-redirects to bonterratech.com/product/deed. Deed
  was surfaced as an Earlybird Venture Capital portfolio company (investment
  2021) and added to the API Evangelist network as a lead. Enrichment found no
  independent public developer portal, API reference, or machine-readable API
  specification for the standalone Go Deed / Deed brand.
